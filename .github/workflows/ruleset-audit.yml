name: Ruleset audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ruleset:
    name: Compare tracked and live main policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Read live ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${GITHUB_REPOSITORY}/rulesets/20775653 > live-ruleset.json
      - name: Compare governance contract
        run: python3 scripts/ruleset_audit.py --expected .github/expected-main-ruleset.json --live live-ruleset.json
