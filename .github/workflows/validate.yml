name: validate

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema reference validator
        run: python -m pip install --disable-pip-version-check -r requirements-schema.lock

      - name: Run repository and schema cross-checks
        env:
          PYTHONPATH: src
        run: |
          make check
          make schema-cross-validate
          python -m latent_triz.cli fingerprint schemas/case.schema.json

  python-311-compatibility:
    name: Python 3.11 compatibility
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned schema reference validator
        run: python -m pip install --disable-pip-version-check -r requirements-schema.lock

      - name: Run repository and schema cross-checks
        env:
          PYTHONPATH: src
        run: |
          make check
          make schema-cross-validate
          python -m latent_triz.cli fingerprint schemas/case.schema.json
