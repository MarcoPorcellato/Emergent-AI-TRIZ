name: Merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CCP_SOURCE_COMMIT: 044697dee9a0d678d30a4847d62ddf9b4970505b
  POLICY_CONTEXT: merge-policy/gate

jobs:
  classify:
    name: Trusted path classification
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      docs_only: ${{ steps.policy.outputs.docs_only }}
      require_ccp: ${{ steps.policy.outputs.require_ccp }}
      require_scientific_audit: ${{ steps.policy.outputs.require_scientific_audit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Classify changed paths with trusted base code
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > changed-files.json
          PYTHONPATH=trusted/src python3 -m latent_triz.merge_policy classify --files-json changed-files.json --github-output "$GITHUB_OUTPUT"

  docs:
    name: Documentation audit
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: make docs-audit

  scientific:
    name: Scientific artifact audit
    needs: classify
    if: needs.classify.outputs.require_scientific_audit == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Parse inert artifacts with trusted base code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > changed-files.json
          PYTHONPATH=trusted/src python3 -m latent_triz.merge_policy audit --files-json changed-files.json --repository candidate

  ccp:
    name: Exact-head CCP receipt
    needs: classify
    if: needs.classify.outputs.require_ccp == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ccp-evidence/${{ github.event.pull_request.head.sha }}
          path: evidence
          persist-credentials: false
          sparse-checkout: .ccp/receipt.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: MarcoPorcellato/commit-ci-preflight
          ref: ${{ env.CCP_SOURCE_COMMIT }}
          path: verifier
          persist-credentials: false
      - name: Verify exact-head receipt against trusted policy
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo build --locked --release --manifest-path verifier/Cargo.toml --bin commit-ci-preflight
          verifier/target/release/commit-ci-preflight verify --receipt evidence/.ccp/receipt.json --policy trusted/.commit-ci-policy.toml --expected-commit "$HEAD_SHA"

  gate:
    name: Publish trusted aggregate
    if: always() && github.event.pull_request.draft == false
    needs: [classify, docs, scientific, ccp]
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Evaluate required lanes and publish exact-head status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          REQUIRE_CCP: ${{ needs.classify.outputs.require_ccp }}
          REQUIRE_SCIENCE: ${{ needs.classify.outputs.require_scientific_audit }}
          DOCS: ${{ needs.docs.result }}
          SCIENTIFIC: ${{ needs.scientific.result }}
          CCP: ${{ needs.ccp.result }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=success
          description="Trusted path and receipt policy passed"
          [[ "$CLASSIFY" == "success" ]] || state=failure
          if [[ "$DOCS_ONLY" == "true" && "$DOCS" != "success" ]]; then state=failure; fi
          if [[ "$REQUIRE_CCP" == "true" && "$CCP" != "success" ]]; then state=failure; fi
          if [[ "$REQUIRE_SCIENCE" == "true" && "$SCIENTIFIC" != "success" ]]; then state=failure; fi
          if [[ "$state" != "success" ]]; then
            description="Required path or receipt qualification failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context="$POLICY_CONTEXT" -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "$state" == "success" ]]
